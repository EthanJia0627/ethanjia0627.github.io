<nav class="paper-links" aria-label="Resources for {{ include.paper.short }}">
  {% for link in include.paper.links %}<a href="{{ link.url }}">{{ link.label }} <span aria-hidden="true">↗</span></a>{% endfor %}
  {% if include.inline_citation and include.paper.bibtex %}
  <button type="button" class="copy-citation citation-link" title="Copy BibTeX" hidden><i class="fa-solid fa-quote-right" aria-hidden="true"></i> <span>BibTeX</span></button>
  <noscript><a href="{{ include.paper.url | relative_url }}#bibtex">BibTeX</a></noscript>
  {% endif %}
</nav>
